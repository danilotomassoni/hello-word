x-app: &app
  build:
    context: .
    dockerfile: dockerfile

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-8080:
    <<: *app
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  app-8081:
    <<: *app
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  app-8082:
    <<: *app
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"

  app-8083:
    <<: *app
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8083:8080"

  app-8084:
    <<: *app
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8084:8080"