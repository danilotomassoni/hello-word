x-app: &app
  build:
    context: .
    dockerfile: dockerfile

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-8080:
    <<: *app
    container_name: app-0
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - network
    ports:
      - "8080:8080"

  app-8081:
    <<: *app
    container_name: app-1
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network
    ports:
      - "8081:8080"

  app-8082:
    <<: *app
    container_name: app-2
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network
    ports:
      - "8082:8080"

  app-8083:
    <<: *app
    container_name: app-3
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network
    ports:
      - "8083:8080"

  app-8084:
    <<: *app
    container_name: app-4
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network
    ports:
      - "8084:8080"

networks:
  network:
    driver: bridge