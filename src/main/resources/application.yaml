spring:
  application:
    name: hello-word
  threads:
    virtual:
      enabled: true
  cache:
    type: redis
    redis:
      time-to-live: 10m
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%level){%level} %clr(%msg%n){%level}"


management:
  endpoints:
    web:
      base-path: /api/v1/actuator

server:
  port: 8080
  tomcat:
    threads:
      max: 40
      min-spare: 10
